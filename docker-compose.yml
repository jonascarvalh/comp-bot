services:
  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_START_SESSION: ${WA_SESSION:-default}
      WAHA_LOCAL_STORE_BASE_DIR: /app/.sessions
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha_sessions:/app/.sessions

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_URL: http://waha:3000
      DATA_DIR: /app/data
    volumes:
      - bot_data:/app/data
    depends_on:
      - waha

volumes:
  waha_sessions:
  bot_data:
